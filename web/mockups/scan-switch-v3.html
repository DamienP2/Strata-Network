<link rel="stylesheet" href="../src/styles-light.css" />
<!--/CSS-->
<style>
/* ── Maquette seulement ── */
[hidden] { display: none !important; }
.view { display: none; height: 100%; }
.view.on { display: block; }
.mk-switch { position: fixed; left: 18px; bottom: 16px; z-index: 400; display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-radius: 12px; background: var(--panel-3); border: 1px solid var(--line-2); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); font-size: 12px; color: var(--text-2); }

/* ── Commun ── */
.ip { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.page-2 { height: 100%; display: grid; grid-template-columns: 240px minmax(0, 1fr); }
.page-2 > .library { min-width: 0; }
.library-inner.full { max-width: none; padding-left: 20px; padding-right: 20px; }
.muted2 { color: var(--text-3); }

/* ── Scan : tableau complet, sans panneau ── */
.xt { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 12.5px; }
.xt th { position: sticky; top: 0; z-index: 2; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); font-weight: 600; padding: 9px 8px; background: var(--panel-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.xt td { height: 34px; padding: 0 8px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xt td:first-child { box-shadow: inset 3px 0 0 var(--bar, transparent); }
.xt tr.used { --bar: var(--pvw); }
.xt tr.off { --bar: var(--warn); }
.xt tr.resv { --bar: var(--accent); }
.xt tr.off td { color: var(--text-2); }
.xt tr.resv td { background-color: color-mix(in srgb, var(--accent) 7%, transparent); }
.xt tr.free td { height: 28px; color: var(--text-3); background-image: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--text-3) 7%, transparent) 7px 9px); }
.xt tbody tr:hover td { background-color: var(--panel-2); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; }
.st::before { content: ''; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.st.used { color: var(--pvw); } .st.used::before { background: var(--pvw); box-shadow: 0 0 6px var(--pvw); }
.st.off { color: var(--warn); } .st.off::before { background: var(--warn); }
.st.resv { color: var(--accent-2); } .st.resv::before { box-shadow: inset 0 0 0 1.5px var(--accent); }
.st.free { color: var(--text-3); font-weight: 500; } .st.free::before { box-shadow: inset 0 0 0 1px var(--line-2); }
.st small { font: 500 11px var(--mono); color: var(--text-3); margin-left: 2px; }
.new-badge { display: inline-flex; font: 700 10.5px/1 Inter, system-ui, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; background: var(--accent); color: var(--on-accent); margin-left: 8px; vertical-align: 1px; }
.ports { display: flex; gap: 4px; flex-wrap: nowrap; align-items: center; }
.port-more { font: 600 11px var(--mono); padding: 1px 6px; border-radius: 10px; border: 1px dashed var(--line-2); color: var(--text-3); }
/* Cellules modifiables : elles ressemblent à du texte, un champ apparaît au survol */
.ed { display: flex; align-items: center; gap: 6px; height: 26px; margin: 0 -6px; padding: 0 6px; border-radius: 6px; border: 1px solid transparent; cursor: text; overflow: hidden; }
.ed > span { overflow: hidden; text-overflow: ellipsis; }
tr:hover .ed { border-color: var(--line); background: var(--panel-3); }
.ed.dd { cursor: pointer; }
.ed.dd > svg:last-child { margin-left: auto; color: var(--text-3); opacity: 0; flex: none; }
tr:hover .ed.dd > svg:last-child { opacity: 1; }
.ed .ph { color: var(--text-3); }
.ed input { border: none; background: none; padding: 0; min-height: 0; width: 100%; font: inherit; color: var(--text); }
.ed.editing { border-color: var(--accent); background: var(--panel-3); }
.kind-ic { color: var(--text-2); flex: none; }
.mac { font: 11.5px var(--mono); color: var(--text-2); }
.vendor { color: var(--text-3); margin-left: 6px; }
.plug { display: flex; align-items: center; gap: 6px; }
.vlan-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 1px 7px 1px 5px; border-radius: 10px; white-space: nowrap; background: color-mix(in srgb, var(--vlan) 16%, transparent); color: var(--text); }
.vlan-tag .vlan-sw { width: 8px; height: 8px; border-radius: 2px; background: var(--vlan); }
.vlan-tag b { font-family: var(--mono); font-weight: 600; }
.acts { display: flex; gap: 2px; justify-content: flex-end; }
.acts .icon-btn { width: 26px; height: 26px; }
.acts .icon-btn.on { color: var(--accent-2); background: var(--accent-soft); border-color: transparent; }
/* Menu ouvert d'un raccordement (démonstration) */
.pop { position: absolute; z-index: 30; width: 280px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); }
.pop .set-label { font-size: 11px; }
.pop .dd-btn { height: 28px; }

/* ── Switchs : une page, façades et ports ── */
.sw-sec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.sw-sec + .sw-sec { margin-top: 14px; }
.sw-sec > header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.sw-sec > header .sw-twirl { flex: none; width: 22px; height: 22px; display: grid; place-items: center; border: none; background: none; color: var(--text-3); cursor: pointer; border-radius: 6px; }
.sw-sec.closed > header .sw-twirl svg { transform: rotate(-90deg); }
.sw-sec > header h2 { margin: 0; font-size: 15px; font-weight: 700; }
.sw-sec > header .muted { font-size: 12px; }
.sw-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.sw-face { display: flex; align-items: center; gap: 18px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line-2); background: linear-gradient(180deg, #171a26, #10121a); overflow-x: auto; }
.sw-block { display: grid; grid-template-rows: repeat(2, 26px); grid-auto-flow: column; gap: 5px 4px; }
.sw-sfp { display: grid; grid-template-rows: repeat(2, 22px); grid-auto-flow: column; gap: 9px 4px; }
.sw-port { position: relative; width: 26px; height: 26px; border-radius: 4px; border: 1px solid #323750; background: #1f2331; color: #a3a8bf; font: 600 11px var(--mono); display: grid; place-items: center; cursor: pointer; padding: 0; }
.sw-port[style*='--vlan'] { background: color-mix(in srgb, var(--vlan) 38%, #1f2331); border-color: var(--vlan); color: #fff; }
.sw-port.trunk { background-image: repeating-linear-gradient(135deg, transparent 0 4px, rgba(255, 255, 255, 0.16) 4px 6px); }
.sw-port.off { opacity: 0.35; }
.sw-port.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw-port .link { position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%; background: #22c55e; }
.sw-port.sfp { width: 38px; height: 22px; border-radius: 3px; }
.sw-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); align-items: center; }
.sw-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.vlan-sw { width: 10px; height: 10px; border-radius: 3px; background: var(--vlan, var(--text-3)); flex: none; }
.trunk-key { width: 14px; height: 10px; border-radius: 2px; border: 1px solid var(--line-2); background: repeating-linear-gradient(135deg, var(--panel-3) 0 3px, var(--line-2) 3px 5px); }
.pt { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 12.5px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.pt th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); font-weight: 600; padding: 8px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.pt td { height: 34px; padding: 0 8px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt tr:last-child td { border-bottom: none; }
.pt tbody tr:hover td { background: var(--panel-2); }
.pt tr.sel td { background: var(--accent-soft) !important; }
.pt tr.off td { color: var(--text-3); }
.pt td:first-child { box-shadow: inset 3px 0 0 var(--vlan, transparent); }
.pt .segmented button { padding: 2px 7px; font-size: 11px; }
.tick { appearance: none; width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--line-2); background: var(--panel-3); cursor: pointer; display: inline-grid; place-items: center; margin: 0; vertical-align: middle; }
.tick:checked { background: var(--accent); border-color: var(--accent); }
.tick:checked::after { content: ''; width: 7px; height: 4px; border: 2px solid var(--on-accent); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.tagged { display: flex; gap: 4px; flex-wrap: nowrap; }
.learnt { font: 11px var(--mono); color: var(--text-3); }
/* Barre d'action quand des ports sont cochés (même style que la barre d'enregistrement) */
.bulk { position: sticky; bottom: 14px; z-index: 20; display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 10px 8px 16px; background: var(--panel-3); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
.bulk b { white-space: nowrap; }
.bulk .dd-btn { width: 170px; height: 30px; }
.sw-mini { display: flex; gap: 2px; margin-left: 6px; }
.sw-mini i { width: 6px; height: 12px; border-radius: 1px; background: var(--vlan, #323750); }
</style>
</head>

  { name: 'SW-Bureaux-03', sub: 'HPE 1930-48G · <span class="ip">10.99.0.13</span> · Étage 2', snmp: '', copper: 48, sfp: 4, open: false, plan: Object.fromEntries(Array.from({ length: 36 }, (_, i) => [i + 1, 50])), trunk: [49], up: [] },
];
V[50] = ['#f5a524', 'Bureautique'];

const face = (s, si) => {
  const port = (n, sfp) => {
    const v = s.plan[n] ?? (s.trunk.includes(n) ? 99 : null);
    const cls = `sw-port${sfp ? ' sfp' : ''}${s.trunk.includes(n) ? ' trunk' : ''}${s.rows?.[n]?.[1] === 'off' ? ' off' : ''}${si === 0 && [13, 14].includes(n) ? ' sel' : ''}`;
    return `<button class="${cls}" ${v ? `style="--vlan:${V[v][0]}"` : ''} title="Port ${n}${v ? ' · VLAN ' + v : ' · libre'}">${n}${s.up.includes(n) ? '<span class="link"></span>' : ''}</button>`;
  };
  let out = '';
  for (let b = 0; b < s.copper / 12; b++) out += `<div class="sw-block">${Array.from({ length: 12 }, (_, i) => port(b * 12 + i + 1)).join('')}</div>`;
  if (s.sfp) out += `<div class="sw-sfp">${Array.from({ length: s.sfp }, (_, i) => port(s.copper + i + 1, true)).join('')}</div>`;
  return `<div class="sw-face">${out}</div>`;
};
const modeSeg = (m) => `<div class="segmented"><button class="${m === 'access' ? 'on' : ''}">Accès</button><button class="${m === 'trunk' ? 'on' : ''}">Trunk</button><button class="${m === 'off' ? 'on' : ''}">Off</button></div>`;
const vlanDd = (v) => `<div class="ed dd">${v ? `<span class="vlan-sw" style="--vlan:${V[v][0]}"></span><span>${v} · ${V[v][1]}</span>` : '<span class="ph">—</span>'}${CHEV}</div>`;
const table = (s) => {
  let rows = '';
  const total = s.copper + s.sfp;
  for (let n = 1; n <= total; n++) {
    const name = n <= s.copper ? `Gi1/0/${n}` : `Te1/1/${n - s.copper}`;
    const r = s.rows[n] ?? ['', 'access', s.plan[n] ?? null, [], '', ''];
    const [label, mode, v, tagged, host, learnt] = r;
    const sel = [13, 14].includes(n);
    rows += `<tr class="${sel ? 'sel' : ''} ${mode === 'off' ? 'off' : ''}" style="${v ? '--vlan:' + V[v][0] : ''}">
      <td><input type="checkbox" class="tick" ${sel ? 'checked' : ''}></td>
      <td><b class="ip">${n}</b> <span class="ip muted2">${name}</span></td>
      <td>${edLabel(label, 'Libellé')}</td>
      <td>${modeSeg(mode)}</td>
      <td>${mode === 'off' ? '' : vlanDd(v)}</td>
      <td>${mode === 'trunk' ? `<div class="tagged">${tagged.map(vtag).join('')}</div>` : ''}</td>
      <td>${host ? `<div class="ed dd"><span>${host}</span>${CHEV}</div>` : mode === 'off' ? '' : `<div class="ed dd"><span class="ph">Raccorder…</span>${CHEV}</div>`}</td>
      <td><span class="learnt">${learnt}</span></td></tr>`;
    if (n === 20 && total > 30) { rows += `<tr><td colspan="8" style="text-align:center;color:var(--text-3);height:30px">… ports 21 à 48 …</td></tr>`; n = 48; }
  }
  return `<table class="pt"><colgroup><col style="width:36px"><col style="width:120px"><col style="width:18%"><col style="width:156px"><col style="width:15%"><col style="width:18%"><col style="width:20%"><col></colgroup>
    <thead><tr><th><input type="checkbox" class="tick"></th><th>Port</th><th>Libellé</th><th>Mode</th><th>VLAN natif</th><th>VLAN taggués</th><th>Raccordé à</th><th>MAC / LLDP</th></tr></thead><tbody>${rows}</tbody></table>`;
};
const legend = (s) => {
  const c = {};
  for (const v of Object.values(s.plan)) c[v] = (c[v] || 0) + 1;
  return `<div class="sw-legend">${Object.entries(c).map(([v, k]) => `<span><span class="vlan-sw" style="--vlan:${V[v][0]}"></span>${v} ${V[v][1]} · ${k}</span>`).join('')}<span><span class="trunk-key"></span>Trunk · ${s.trunk.length}</span><span><span class="vlan-sw"></span>Libre · ${s.copper + s.sfp - Object.keys(s.plan).length - s.trunk.length}</span></div>`;
};
document.getElementById('switches').innerHTML = SW.map((s, i) => `
  <section class="sw-sec ${s.open ? '' : 'closed'}">
    <header>
      <button class="sw-twirl" title="${s.open ? 'Replier les ports' : 'Déplier les ports'}">${CHEV}</button>
      <div style="min-width:0"><h2>${s.name}</h2><p class="muted" style="margin:2px 0 0">${s.sub} · ${s.copper ? s.copper + ' + ' : ''}${s.sfp} ports</p></div>
      <div class="spacer"></div>
      ${s.snmp ? `<span class="badge">${s.snmp}</span>` : ''}
      <button class="btn small"><svg xmlns="http://www.w3.org/2000/svg" class="" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg> Modifier</button>
    </header>
    <div class="sw-body">
      ${face(s, i)}
      ${legend(s)}
      ${s.open ? table(s) : ''}
    </div>
  </section>`).join('') + `
  <div class="bulk"><b>2 ports cochés</b><span class="muted">Gi1/0/13, Gi1/0/14</span><div class="spacer"></div>
    <span class="muted">Mode</span><div class="segmented"><button class="on">Accès</button><button>Trunk</button><button>Off</button></div>
    <span class="muted">VLAN</span><button class="dd-btn"><span class="dd-icon"><span class="vlan-sw" style="--vlan:#8fa3ff"></span></span><span class="dd-label">20 · Caméras</span>${CHEV}</button>
    <button class="btn ghost">Décocher</button><button class="btn primary"><svg xmlns="http://www.w3.org/2000/svg" class="" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg> Appliquer</button></div>`;

// Maquette : écrans et thème
document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-go]').forEach((x) => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.dataset.view === b.dataset.go));
}));
document.querySelectorAll('[data-theme-set]').forEach((b) => b.addEventListener('click', () => {
  if (b.dataset.themeSet === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme;
  document.querySelectorAll('[data-theme-set]').forEach((x) => x.classList.toggle('on', x === b));
}));
</script>
</body>
</html>
