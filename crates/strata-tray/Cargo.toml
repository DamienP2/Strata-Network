[package]
name = "strata-tray"
description = "Strata Network desktop launcher (macOS menu bar, Windows notification area)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "strata-tray"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
ureq = "3"
directories = "6"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = "0.26"
tao = "0.37"
